name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run Ruff (lint)
        run: |
          ruff check app/ tests/ evaluation/

      - name: Run Ruff (format check)
        run: |
          ruff format --check app/ tests/ evaluation/

      - name: Run MyPy (type check)
        run: |
          mypy app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run evaluation (accuracy)
        run: |
          python -m evaluation.run

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/
          retention-days: 7

  test-with-redis:
    name: Tests with Redis Stack
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Wait for Redis
        run: |
          sleep 10
          redis-cli ping

      - name: Run tests with Redis
        env:
          REDIS_URL: redis://localhost:6379/0
          VECTOR_BACKEND: redisearch
        run: |
          python -m pytest tests/ -v --tb=short

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .[dev]

      - name: Run pip-audit
        run: |
          pip-audit --desc --strict

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t verigate:test .

      - name: Test Docker image runs
        run: |
          docker run --rm -d --name verigate-test -p 8000:8000 verigate:test
          sleep 15
          curl -f http://localhost:8000/health
          docker stop verigate-test

  # Only run on main branch
  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [lint-and-typecheck, test, test-with-redis, security-audit, docker-build]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed! Ready for deployment."