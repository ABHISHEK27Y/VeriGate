name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run Ruff (lint)
        run: |
          ruff check .

      - name: Run Ruff (format check)
        run: |
          ruff format --check app/ tests/ evaluation/ scripts/

      - name: Run MyPy (type check)
        run: |
          mypy app/ evaluation/ scripts/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historical answer-policy study source is verified at its commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=evaluation/results/tests.xml
          python scripts/record_test_summary.py

      - name: Run evaluation (accuracy)
        run: |
          python -m evaluation.run

      - name: Verify generated report tables
        run: |
          python scripts/export_report_tables.py
          python -m scripts.verify_evidence_bundle evidence-20261029-hash-v3
          python -m scripts.export_directional_report evidence-20261029-hash-v3
          python -m scripts.export_answer_policy_report answer_aware_20261029_v6
          python -m scripts.verify_current_pilots
          python -m scripts.verify_live_runs
          git diff --exit-code -- evaluation/results/checks.json report/generated/ docs/RESULTS_DIRECTIONAL.md docs/RESULTS_ANSWER_AWARE.md

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/
          retention-days: 7

  test-with-redis:
    name: Tests with Redis Stack
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Wait for Redis
        run: |
          sleep 10
          python -c "import redis; assert redis.Redis(host='localhost', port=6379).ping()"

      - name: Run tests with Redis
        env:
          REDIS_URL: redis://localhost:6379/0
          VECTOR_BACKEND: redisearch
          CACHE_MATCH_MODE: semantic
          TEST_ALLOW_REDIS_FLUSHDB: "1"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Live HTTP benchmark with Redis Stack and delayed mock provider
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m scripts.benchmark_live_gateway evaluation/results/live_http_redis_ci

      - name: Two-worker shared Redis checks
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m scripts.test_multiworker_redis evaluation/results/multiworker_redis_ci

      - name: Real MiniLM and NLI live HTTP benchmark
        timeout-minutes: 25
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m scripts.benchmark_real_semantic evaluation/results/real_semantic_ci

      - name: Compare lazy and required NLI prewarm on one runner
        timeout-minutes: 25
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m scripts.benchmark_prewarm_semantic evaluation/results/prewarm_semantic_ci

      - name: Upload live benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-http-redis-benchmark
          path: evaluation/results/live_http_redis_ci/
          retention-days: 7

      - name: Upload real semantic and multi-worker artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-semantic-and-multiworker
          path: |
            evaluation/results/real_semantic_ci/
            evaluation/results/multiworker_redis_ci/
            evaluation/results/prewarm_semantic_ci/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run pip-audit
        run: |
          python scripts/audit_dependencies.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t verigate:test .

      - name: Test Docker image runs
        run: |
          docker run --rm -d --name verigate-test -p 8000:8000 verigate:test
          sleep 15
          curl -f http://localhost:8000/health
          docker stop verigate-test

  # Only run on main branch
  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [lint-and-typecheck, test, test-with-redis, security-audit, docker-build]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed! Ready for deployment."
