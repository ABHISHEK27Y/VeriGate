[pytest]
# Add the project root to sys.path so `import app` works when running `pytest`
# directly (not just `python -m pytest`).
pythonpath = .
# Also make the tests/ folder importable so `from conftest import HEADERS` works.
testpaths = tests
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
