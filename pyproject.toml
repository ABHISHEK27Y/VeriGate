[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verigate"
version = "0.1.0"
description = "Adaptive self-verifying semantic cache for LLM gateways"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.14.1,<3",
    "redis==5.2.1",
    "fakeredis==2.26.2",
    "numpy==2.2.1",
    "prometheus-client==0.21.1",
    "httpx==0.28.1",
    "sentence-transformers==3.0.1",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==5.0.0",
    "matplotlib==3.10.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pip-audit==2.8.0",
]
eval = [
    "matplotlib==3.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T10", "PTH", "PD", "PGH", "PL", "TRY"]
ignore = ["S101", "TRY003"]
per-file-ignores = {
    "tests/__init__.py" = ["S101"],
    "evaluation/__init__.py" = ["S101"],
    "demo.py" = ["S101", "T201"],
    "demo_live.py" = ["S101", "T201"],
    "demo_semantic.py" = ["S101", "T201"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-q --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]